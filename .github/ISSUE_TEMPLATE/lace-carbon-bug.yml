name: Lace Carbon - Bug Report
description: Report a bug found during Lace Carbon testing
title: "[Carbon Bug]: "
labels: ["bug", "carbon-release", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Lace Carbon. Please fill out the fields below so we can reproduce and fix the issue quickly.

  - type: input
    id: version
    attributes:
      label: Lace version / build
      description: Found in Settings > About, or pre-filled if you used the in-app "Report a bug" link.
      placeholder: e.g. 1.20.0-carbon-rc3
    validations:
      required: true

  - type: dropdown
    id: network
    attributes:
      label: Network
      options:
        - Mainnet
        - Preprod
        - Preview
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: e.g. Chrome 124, Brave 1.66
    validations:
      required: true

  - type: dropdown
    id: wallet-type
    attributes:
      label: Wallet setup
      options:
        - Software wallet
        - Ledger
        - Trezor
        - Keystone
        - Other hardware
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Number each step. Be specific.
      placeholder: |
        1. Open Lace
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Blocker (cannot use core functionality)
        - Major (significant impact, workaround exists)
        - Minor (small issue, low impact)
        - Cosmetic (visual only)
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Frequency
      options:
        - Always
        - Sometimes
        - Once
        - Unable to reproduce
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: Screenshots, video, or logs
      description: Drag-and-drop files here. Console logs are especially helpful.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I am testing the Carbon release build
          required: true
