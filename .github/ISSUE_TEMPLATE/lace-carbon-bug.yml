name: Lace Carbon - Feedback or Suggestion
description: Share UX feedback, a feature request, or a suggested improvement
title: "[Carbon Feedback]: "
labels: ["feedback", "carbon-release", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing feedback on Lace Carbon. This form is for anything that isn't a reproducible bug: UX or UI suggestions, missing functionality, ideas for improvement, or general thoughts. Bugs should be filed using the Bug Report template instead.

  - type: input
    id: version
    attributes:
      label: Lace version / build
      description: Found in Settings > About, or pre-filled if you used the in-app feedback link.
      placeholder: e.g. 1.20.0-carbon-rc3
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: What kind of feedback is this?
      options:
        - UX / UI
        - Missing functionality
        - Improvement to existing feature
        - Other
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Where in the product
      description: Which screen, flow, or area does this relate to?
      placeholder: e.g. Send transaction flow, Staking dashboard, Onboarding step 3
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What is the feedback
      description: Describe the suggestion or observation in your own words. One or two sentences is fine.
    validations:
      required: true

  - type: textarea
    id: why-it-matters
    attributes:
      label: Why it matters
      description: What's the user impact? Who benefits, and how? This helps us prioritize.
    validations:
      required: true

  - type: textarea
    id: suggested-solution
    attributes:
      label: Suggested solution (optional)
      description: If you have an idea for how to address it, share it here. Totally fine to leave blank.

  - type: textarea
    id: attachments
    attributes:
      label: Screenshots, mockups, or references (optional)
      description: Drag-and-drop images, sketches, or links to similar patterns in other products.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: This is not a reproducible bug (bugs go in the Bug Report template)
          required: true
